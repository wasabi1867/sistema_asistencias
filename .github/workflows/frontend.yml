# Revisa el estilo del código y compila el frontend (export estático de Next.js) en cada
# cambio. Desde Next.js 16, compilar ya no corre ESLint: va en su propio paso.
name: Frontend

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', 'next.config.mjs', 'tailwind.config.ts', 'eslint.config.mjs', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', 'next.config.mjs', 'tailwind.config.ts', 'eslint.config.mjs', '.github/workflows/frontend.yml']

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
