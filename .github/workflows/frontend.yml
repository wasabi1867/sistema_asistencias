# Compila el frontend (export estático de Next.js) en cada cambio.
name: Frontend

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', 'next.config.mjs', 'tailwind.config.ts', '.eslintrc.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json', 'next.config.mjs', 'tailwind.config.ts', '.eslintrc.json', '.github/workflows/frontend.yml']

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
